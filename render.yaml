services:
  - type: web
    name: ai-agent-course
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd multi_agent_chatbot && chainlit run agentic_chatbot.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: CHAINLIT_AUTH_SECRET
        sync: false
      - key: CHAINLIT_USERNAME
        sync: false
      - key: CHAINLIT_PASSWORD
        sync: false